<div class="filters-panel">

  <input
    type="text"
    placeholder="Buscar proyecto..."
    [(ngModel)]="search"
    (input)="onSearchChange()"
    class="search-input"
  />

  <div class="filter-group">
    <p class="group-title">Año</p>
    <div class="chips-wrap">
      @for (year of years; track year) {
        <span
          class="chip"
          [class.active]="selectedYears.includes(year)"
          (click)="toggleYear(year)">
          {{ year }}
        </span>
      }
    </div>
  </div>

  <div class="filter-group">
    <p class="group-title">Stack</p>
    <div class="chips-wrap">
      @for (stack of stacks; track stack) {
        <span
          class="chip"
          [class.active]="selectedStacks.includes(stack)"
          (click)="toggleStack(stack)">
          {{ stack }}
        </span>
      }
    </div>
  </div>

  <div class="filter-group">
    <p class="group-title">Tecnología</p>
    <div class="chips-wrap">
      @for (tag of tags; track tag) {
        <span
          class="chip"
          [class.active]="selectedTags.includes(tag)"
          (click)="toggleTag(tag)">
          {{ tag }}
        </span>
      }
    </div>
  </div>

  @if (hasActiveFilters) {
    <button class="clear-btn" (click)="clear()">Limpiar filtros</button>
  }

</div>
