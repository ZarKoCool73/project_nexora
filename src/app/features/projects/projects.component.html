<section id="projects" reveal>

  <div class="section-header">
    <h2 class="section-title">
      Proyectos
      <span class="projects-count">({{ filteredProjects.length }})</span>
    </h2>
    <div class="section-line"></div>
  </div>

  <div class="projects-layout">

    <aside class="projects-sidebar">
      <app-project-filters
        [tags]="availableTags"
        [years]="availableYears"
        [stacks]="availableStacks"
        (filtersChange)="onFiltersChange($event)">
      </app-project-filters>
    </aside>

    <div class="projects-list">
      @for (project of filteredProjects; track project.id) {
        <app-project-list-item [project]="project"></app-project-list-item>
      } @empty {
        <p class="empty-state">No se encontraron proyectos con estos filtros.</p>
      }
    </div>

  </div>

</section>
