<div class="project-row"
     [class.tier-hero]="project.tier === 'hero'"
     [class.tier-featured]="project.tier === 'featured'"
     [class.is-archived]="project.tier === 'minor'"
     [attr.href]="project.url || null"
     [attr.target]="project.url ? '_blank' : null"
     [attr.rel]="project.url ? 'noopener noreferrer' : null" (click)="openProject()">

  <div class="row-logos">
    @if (project.companyLogo) {
      <div class="logo-circle">
        <img [src]="project.companyLogo" [alt]="project.companyName || project.title"/>
      </div>
    }
    @if (project.clientLogo) {
      <div class="logo-circle">
        <img [src]="project.clientLogo" [alt]="project.clientName || project.title"/>
      </div>
    }
    @if (!project.companyLogo && !project.clientLogo) {
      <div class="logo-circle">
        <span class="row-initials">{{ initials }}</span>
      </div>
    }
  </div>

  <div class="row-main">
    <div class="row-title-line">
      <h3 class="row-title">{{ project.title }}</h3>
      @if (badgeLabel) {
        <span class="row-badge" [ngClass]="badgeClass">{{ badgeLabel }}</span>
      }
    </div>
    <p class="row-desc">{{ project.desc }}</p>
  </div>

  <div class="row-meta">
    <span class="row-stack">{{ project.stack }}</span>
    <span class="row-year">{{ project.year }}</span>
  </div>

  <span class="row-arrow">↗</span>

</div>
